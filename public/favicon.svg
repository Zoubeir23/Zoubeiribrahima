<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="512" height="512" rx="128" fill="url(#gradient)"/>

  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Text Z.I.A -->
  <text x="256" y="320" font-family="Arial, sans-serif" font-size="160" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-5">Z.I.A</text>

  <!-- Small dot accent -->
  <circle cx="256" cy="420" r="20" fill="#60A5FA"/>
</svg>
